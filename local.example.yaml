Relay:
  Model: ""
  Url: ""
  ApiKey: ""
  Temperature: 0
  Stream: True
  Cache: True

Database:
  # 选择：mysql / sqlite / postgresql
  Type: "sqlite"

  # SQLite 配置（Type=sqlite 时使用）
  Sqlite:
    Path: "word_cache.db"

  # MySQL 配置（Type=mysql 时使用）
  Mysql:
    Host: "127.0.0.1"
    Port: 3306
    Dbname: "translate_transfer"
    Username: "root"
    Password: ""
    Params: "charset=utf8mb4"

  # PostgreSQL 配置（Type=postgresql 时使用）
  Postgresql:
    Host: "127.0.0.1"
    Port: 5432
    Dbname: "translate_transfer"
    Username: "postgres"
    Password: ""
    Params: "sslmode=disable"
